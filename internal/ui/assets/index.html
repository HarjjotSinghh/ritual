<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ritual</title>
<style>
  /* The same design system as the website: one achromatic ramp, one accent
     reserved for things you can act on, and a page built out of hairlines
     rather than stacked cards. No webfont, because the dashboard is served
     from loopback under a CSP that allows no external resources. */
  :root {
    --bg: oklch(0.992 0.001 265);
    --panel: oklch(1 0 0);
    --ink: oklch(0.175 0.006 265);
    --muted: oklch(0.505 0.008 265);
    --line: oklch(0.915 0.003 265);
    --hatch: oklch(0.915 0.003 265 / 55%);
    --accent: oklch(0.52 0.17 258);
    --accent-soft: oklch(0.955 0.008 258);
    --accent-ink: oklch(0.32 0.05 258);
    --good: oklch(0.52 0.12 152);
    --warn: oklch(0.58 0.11 72);
    --bad: oklch(0.545 0.19 27);
    --radius: 4px;
    --dur: 150ms;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(0.155 0.004 265);
      --panel: oklch(0.185 0.005 265);
      --ink: oklch(0.93 0.004 265);
      --muted: oklch(0.66 0.009 265);
      --line: oklch(1 0 0 / 11%);
      --hatch: oklch(1 0 0 / 7%);
      --accent: oklch(0.72 0.145 258);
      --accent-soft: oklch(0.26 0.025 258);
      --accent-ink: oklch(0.86 0.05 258);
      --good: oklch(0.74 0.13 155);
      --warn: oklch(0.78 0.12 78);
      --bad: oklch(0.68 0.17 25);
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* The two vertical hairlines the whole page terminates on, plus the hatched
     margin outside them. Fixed and never interactive. */
  .rules {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    display: flex;
    justify-content: center;
  }
  .rules::before {
    content: "";
    position: absolute;
    inset-block: 0;
    width: 1280px;
    max-width: 100%;
    border-inline: 1px solid var(--line);
  }
  .rules::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 7px)
        left / calc(50% - 640px) 100% no-repeat,
      repeating-linear-gradient(45deg, var(--hatch) 0 1px, transparent 1px 7px)
        right / calc(50% - 640px) 100% no-repeat;
    opacity: 0.6;
  }

  .shell {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1280px;
    margin-inline: auto;
    padding-inline: 20px;
  }
  @media (min-width: 768px) { .shell { padding-inline: 36px; } }

  .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .tabular { font-variant-numeric: tabular-nums; }

  header { border-bottom: 1px solid var(--line); }
  .head {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    align-items: baseline;
    padding-block: 18px;
  }
  .wordmark { font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
  .brand-sub { color: var(--muted); font-size: 13px; margin-left: 10px; }
  .head-meta { margin-left: auto; display: flex; align-items: baseline; gap: 10px; }
  .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .tag {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--warn);
    border: 1px solid currentColor; border-radius: var(--radius); padding: 1px 6px;
  }

  main { padding-bottom: 72px; }

  .stats {
    display: flex; flex-wrap: wrap; gap: 0 28px;
    border-bottom: 1px solid var(--line); padding-block: 14px;
  }
  .stat { display: flex; align-items: baseline; gap: 8px; }
  .stat b { font-family: var(--mono); font-weight: 600; font-size: 13px; }
  .stat span { color: var(--muted); font-size: 12px; }

  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
  @media (min-width: 960px) {
    .layout { grid-template-columns: 22rem minmax(0, 1fr); }
    .col-list { border-right: 1px solid var(--line); padding-right: 24px; }
    .col-detail { padding-left: 28px; }
  }

  .col-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-top: 22px; padding-bottom: 10px;
  }
  .count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .filters { display: flex; gap: 4px; flex-wrap: wrap; padding-bottom: 12px; }
  .filters button {
    display: inline-flex; align-items: center; gap: 5px;
    font: inherit; font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: var(--radius);
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); cursor: pointer;
    transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
  }
  .filters button:hover { color: var(--ink); }
  .filters button[aria-pressed="true"] {
    color: var(--ink); border-color: var(--ink);
  }

  .list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .card {
    border: 0; border-bottom: 1px solid var(--line);
    padding: 12px 10px 12px 0; cursor: pointer; text-align: left; width: 100%;
    font: inherit; color: inherit; background: transparent;
    transition: background-color var(--dur) var(--ease);
  }
  .card:hover { background: var(--accent-soft); }
  .card[aria-selected="true"] {
    background: var(--accent-soft);
    box-shadow: inset 2px 0 0 var(--accent);
    padding-left: 10px;
  }
  .card h3 { margin: 6px 0 3px; font-size: 14px; font-weight: 500; letter-spacing: -0.01em; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .row { display: flex; align-items: center; gap: 8px; }

  .kind {
    font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .glyph { width: 13px; height: 13px; flex: none; }
  .detail .kind .glyph { width: 15px; height: 15px; }
  .kind[data-kind="skill"] { color: var(--good); }
  .kind[data-kind="rule"], .kind[data-kind="command"] { color: var(--accent); }
  .kind[data-kind="hook"], .kind[data-kind="update"] { color: var(--warn); }
  .score { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

  .col-detail { padding-top: 22px; }
  .detail h2 { margin: 6px 0 4px; font-size: 24px; letter-spacing: -0.03em; font-weight: 500; }
  .lede { color: var(--muted); margin: 0 0 16px; }
  .detail h4 {
    margin: 26px 0 10px; font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 10px;
  }

  ol.steps { margin: 0; padding-left: 18px; }
  ol.steps li { margin-bottom: 5px; }
  .support { font-family: var(--mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .bars { display: grid; grid-template-columns: minmax(7rem, auto) 1fr 2.5rem; gap: 7px 12px; align-items: center; font-size: 13px; }
  .bar { height: 1px; background: var(--line); position: relative; }
  .bar i { display: block; height: 3px; margin-top: -1px; background: var(--accent); }

  .evidence { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 0; margin: 0; list-style: none; }
  .evidence li { margin-bottom: 5px; }

  .quotes { margin: 0; padding: 0; list-style: none; }
  .quotes li { font-size: 13.5px; margin-bottom: 5px; }
  .quotes li::before { content: "\201C"; color: var(--muted); }
  .quotes li::after { content: "\201D"; color: var(--muted); }

  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; overflow: auto; font-family: var(--mono); font-size: 12px;
    line-height: 1.6; max-height: 460px; margin: 0;
  }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
  button.go {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: var(--radius);
    border: 1px solid var(--accent); background: var(--accent); color: var(--bg);
    cursor: pointer; transition: opacity var(--dur) var(--ease);
  }
  button.go:hover:not(:disabled) { opacity: 0.85; }
  button.go:active:not(:disabled) { transform: translateY(1px); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.ghost:hover:not(:disabled) { border-color: var(--ink); opacity: 1; }
  /* A disabled action reads as unavailable without dropping its label below
     legibility, which a low-opacity filled button does. */
  button.go:disabled {
    background: transparent; color: var(--muted);
    border-color: var(--line); cursor: not-allowed;
  }

  label.target {
    font-family: var(--mono); font-size: 12px; display: inline-flex; gap: 5px;
    align-items: center; cursor: pointer; padding: 3px 0;
  }

  :where(button, a, input, [tabindex]):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--radius);
  }

  .note { color: var(--warn); font-size: 13px; margin: 6px 0 0; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status[data-tone="bad"] { color: var(--bad); }

  .empty { color: var(--muted); padding: 48px 0; text-align: center; font-size: 14px; }
  .empty b { display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; }

  /* Loading placeholders match the shape of what replaces them, so the page
     does not jump when the report arrives. */
  .skel { background: var(--line); border-radius: 2px; height: 10px; opacity: 0.6; }
  .skel-row { border-bottom: 1px solid var(--line); padding: 14px 0; }
  @media (prefers-reduced-motion: no-preference) {
    .skel { animation: pulse 1.2s var(--ease) infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.7; } }

  footer {
    position: relative; z-index: 1;
    color: var(--muted); font-size: 12.5px; padding: 24px 20px; text-align: center;
    border-top: 1px solid var(--line);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="rules" aria-hidden="true"></div>

<header>
  <div class="shell head">
    <div>
      <span class="wordmark">ritual</span>
      <span class="brand-sub">workflows mined from your agent history</span>
    </div>
    <div class="head-meta">
      <span class="meta">{{.Generated}}</span>
      {{if not .AllowWrite}}<span class="tag">read only</span>{{end}}
    </div>
  </div>
</header>

<main>
  <div class="shell">
    <div class="stats" id="stats"></div>
    <div class="layout">
      <section class="col-list" aria-label="Findings">
        <div class="col-head">
          <p class="label">Findings</p>
          <span class="count" id="count"></span>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Filter by verdict"></div>
        <div class="list" id="list"></div>
      </section>
      <section class="col-detail">
        <div class="detail" id="detail" aria-live="polite"></div>
      </section>
    </div>
  </div>
</main>

<footer>Everything on this page came from files on this machine. Nothing was uploaded.</footer>

<script>
const TOKEN = {{.Token}};
const ALLOW_WRITE = {{.AllowWrite}};

async function api(path, opts) {
  const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(TOKEN);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error('request failed: ' + res.status);
  return res.json();
}

let report = null;
let selected = null;
let filter = 'all';

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const KINDS = ['all', 'skill', 'command', 'rule', 'hook', 'reference', 'update', 'everything'];

// One glyph per verdict, extracted from lucide (ISC) so the dashboard matches
// the website without loading an icon font the CSP would block anyway.
const KIND_ICONS = {
  skill: '<rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/>',
  command: '<path d="M12 19h8"/><path d="m4 17 6-6-6-6"/>',
  rule: '<path d="M12 3v18"/><path d="m19 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M3 7h1a17 17 0 0 0 8-2 17 17 0 0 0 8 2h1"/><path d="m5 8 3 8a5 5 0 0 1-6 0zV7"/><path d="M7 21h10"/>',
  hook: '<path d="M18 16.98h-5.99c-1.1 0-1.95.94-2.48 1.9A4 4 0 0 1 2 17c.01-.7.2-1.4.57-2"/><path d="m6 17 3.13-5.78c.53-.97.1-2.18-.5-3.1a4 4 0 1 1 6.89-4.06"/><path d="m12 6 3.13 5.73C15.66 12.7 16.9 13 18 13a4 4 0 0 1 0 8"/>',
  reference: '<path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/>',
  update: '<path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z"/><path d="M14.487 7.858A1 1 0 0 1 14 7V2"/><path d="M20 19.645V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l2.516 2.516"/><path d="M8 18h1"/>',
  ignore: '<path d="m2 2 20 20"/><path d="M5 5a1 1 0 0 0-1 1v7c0 5 3.5 7.5 7.67 8.94a1 1 0 0 0 .67.01c2.35-.82 4.48-1.97 5.9-3.71"/><path d="M9.309 3.652A12.252 12.252 0 0 0 11.24 2.28a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1v7a9.784 9.784 0 0 1-.08 1.264"/>',
};

function kindIcon(kind) {
  const body = KIND_ICONS[kind];
  if (!body) return '';
  return '<svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    body + '</svg>';
}

function entries() {
  const findings = (report.findings || []).map(f => ({ ...f, _type: 'finding' }));
  const rules = (report.rules || []).map(r => ({ ...r, _type: 'rule', title: r.text, score: { total: r.occurrences * 10 } }));
  const all = findings.concat(rules);
  if (filter === 'all') return all.filter(e => (e.decision || {}).kind !== 'ignore');
  if (filter === 'everything') return all;
  return all.filter(e => (e.decision || {}).kind === filter);
}

function renderStats() {
  const w = report.window || {};
  const stats = [
    [w.sessions || 0, 'sessions'],
    [w.agents || 0, 'agents'],
    [report.arcs || 0, 'task arcs'],
    [report.clustered || 0, 'in a repeating workflow'],
  ];
  if (w.earliest) stats.push([w.earliest.slice(0, 10) + ' to ' + (w.latest || '').slice(0, 10), 'window']);

  document.getElementById('stats').innerHTML = stats.map(s =>
    '<span class="stat"><b class="tabular">' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></span>').join('');

  document.getElementById('filters').innerHTML = KINDS.map(k =>
    '<button type="button" data-filter="' + k + '" aria-pressed="' + (k === filter) + '">' +
      kindIcon(k) + k + '</button>').join('');

  document.querySelectorAll('#filters button').forEach(b => {
    b.onclick = () => { filter = b.dataset.filter; renderStats(); renderList(); };
  });
}

function renderList() {
  const list = document.getElementById('list');
  const items = entries();
  document.getElementById('count').textContent = items.length;

  if (!items.length) {
    list.innerHTML = '<p class="empty"><b>Nothing in this category.</b>Try another verdict, or "everything".</p>';
    return;
  }

  list.innerHTML = items.map(e => {
    const kind = (e.decision || {}).kind || 'rule';
    const summary = e.summary || (e.occurrences + ' times across ' + e.sessions + ' sessions');
    // A rule has no 0..100 score, so it shows how often it was stated instead
    // of a number that would read as one and go past 100.
    const metric = e._type === 'rule'
      ? '&times;' + e.occurrences
      : Math.round((e.score || {}).total || 0);
    return '<button type="button" class="card" data-id="' + esc(e.id) + '" aria-selected="' + (selected === e.id) + '">' +
      '<div class="row">' +
        '<span class="kind" data-kind="' + esc(kind) + '">' + kindIcon(kind) + esc(kind) + '</span>' +
        '<span class="score">' + metric + '</span>' +
      '</div>' +
      '<h3>' + esc(e.title || e.text) + '</h3>' +
      '<p>' + esc(summary) + '</p>' +
    '</button>';
  }).join('');

  const cards = [...document.querySelectorAll('.card')];
  cards.forEach((c, i) => {
    c.onclick = () => select(c.dataset.id);
    // Up and down move through the list without leaving the keyboard, which is
    // how anyone reviewing twenty findings in a row will actually read them.
    c.onkeydown = (ev) => {
      if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
      ev.preventDefault();
      const next = cards[i + (ev.key === 'ArrowDown' ? 1 : -1)];
      if (next) { next.focus(); select(next.dataset.id); }
    };
  });
}

async function select(id) {
  selected = id;
  renderList();
  const e = entries().find(x => x.id === id) || (report.findings || []).find(x => x.id === id);
  if (!e) return;
  const detail = document.getElementById('detail');
  detail.innerHTML = e._type === 'rule' ? ruleView(e) : findingView(e);
  wireActions(e);
}

function findingView(f) {
  const kind = (f.decision || {}).kind || '';
  const steps = (f.steps || []).map(s =>
    '<li>' + esc(describeStep(s.action)) + ' <span class="support">' + s.count + '/' + f.occurrences + ' runs</span></li>').join('');
  const comps = (f.score || {}).components || {};
  const bars = Object.keys(comps).map(k =>
    '<span>' + esc(k.replace(/_/g, ' ')) + '</span>' +
    '<span class="bar"><i style="width:' + Math.round(comps[k] * 100) + '%"></i></span>' +
    '<span class="support">' + comps[k].toFixed(2) + '</span>').join('');
  const penalties = ((f.score || {}).penalties || []).map(p =>
    '<p class="note">penalty, ' + esc(p.name) + ': ' + esc(p.reason) + '</p>').join('');
  const evidence = (f.evidence || []).map(e =>
    '<li>' + esc((e.at || '').slice(0, 10)) + '  ' + esc(e.agent) + '  ' + esc(e.intent) + '</li>').join('');
  const corrections = (f.corrections || []).map(c => '<li>' + esc(c.text) + '</li>').join('');

  return '<span class="kind" data-kind="' + esc(kind) + '">' + kindIcon(kind) + esc(kind) + '</span>' +
    '<h2>' + esc(f.title) + '</h2>' +
    '<p class="lede">' + esc(f.summary) + '</p>' +
    '<p class="support">score ' + Math.round((f.score || {}).total || 0) + '/100 &middot; cohesion ' + Math.round((f.cohesion || 0) * 100) + '%</p>' +
    '<p class="lede" style="margin-top:12px">' + esc((f.decision || {}).rationale) + '</p>' +
    (steps ? '<h4>Canonical sequence</h4><ol class="steps">' + steps + '</ol>' : '') +
    (corrections ? '<h4>Corrections during these runs</h4><ul class="quotes">' + corrections + '</ul>' : '') +
    '<h4>Score breakdown</h4><div class="bars">' + bars + '</div>' + penalties +
    '<h4>Evidence</h4><ul class="evidence">' + evidence + '</ul>' +
    '<h4>Artifact</h4><pre id="preview">loading</pre>' +
    actionBar();
}

function ruleView(r) {
  const examples = (r.examples || []).map(e =>
    '<li>' + esc((e.at || '').slice(0, 10)) + '  ' + esc(e.agent) + '  ' + esc(e.text) + '</li>').join('');
  return '<span class="kind" data-kind="rule">' + kindIcon('rule') + esc((r.decision || {}).kind || 'rule') + '</span>' +
    '<h2>Standing preference</h2>' +
    '<p class="lede">' + esc(r.text) + '</p>' +
    '<p class="support">stated ' + r.occurrences + ' times across ' + r.sessions + ' sessions</p>' +
    '<p class="lede" style="margin-top:12px">' + esc((r.decision || {}).rationale) + '</p>' +
    '<h4>Every time it was said</h4><ul class="evidence">' + examples + '</ul>' +
    '<h4>Artifact</h4><pre id="preview">loading</pre>' +
    actionBar();
}

function actionBar() {
  const targets = ['claude', 'codex', 'cursor', 'opencode', 'gemini', 'shared'];
  return '<h4>Install into</h4>' +
    '<div class="actions">' +
      targets.map(t => '<label class="target"><input type="checkbox" value="' + t + '"' + (t === 'claude' ? ' checked' : '') + '> ' + t + '</label>').join('') +
    '</div>' +
    '<div class="actions">' +
      '<button type="button" class="go ghost" id="plan">Preview plan</button>' +
      '<button type="button" class="go" id="install"' + (ALLOW_WRITE ? '' : ' disabled title="restart with --allow-install"') + '>Install</button>' +
      '<span class="status" id="status" role="status"></span>' +
    '</div>';
}

function describeStep(action) {
  if (action.startsWith('shell:')) return 'Run `' + action.slice(6) + '`';
  if (action.startsWith('mcp:')) return 'Call the ' + action.slice(4).split(':')[0] + ' integration';
  if (action.startsWith('tool:')) return 'Use ' + action.slice(5).replace(/-/g, ' ');
  return ({
    read: 'Read the relevant files', write: 'Write the new file', edit: 'Edit the affected files',
    search: 'Search the codebase', list: 'List the candidate files', browser: 'Verify in a browser',
    plan: 'Write the task list', subagent: 'Delegate to subagents', skill: 'Invoke the matching skill',
  })[action] || action;
}

function setStatus(text, tone) {
  const status = document.getElementById('status');
  if (!status) return;
  status.textContent = text;
  status.dataset.tone = tone || '';
}

async function wireActions(e) {
  const pre = document.getElementById('preview');
  try {
    const bundle = await api('/api/artifact?id=' + encodeURIComponent(e.id));
    if (pre) pre.textContent = (bundle.files || []).map(f => '-- ' + f.path + ' --\n' + f.content).join('\n\n');
  } catch (err) {
    if (pre) pre.textContent = 'Could not read the artifact: ' + err.message;
  }

  const targets = () => [...document.querySelectorAll('.target input:checked')].map(i => i.value);

  const planBtn = document.getElementById('plan');
  if (planBtn) {
    planBtn.onclick = async () => {
      setStatus('planning');
      try {
        const res = await api('/api/install', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: e.id, targets: targets(), dry_run: true }),
        });
        const writes = (res.plans || []).flatMap(p => p.writes).map(w => w.action + ' ' + w.path);
        setStatus(res.error || writes.join('   ') || 'nothing to do', res.error ? 'bad' : '');
      } catch (err) {
        setStatus(err.message, 'bad');
      }
    };
  }

  const installBtn = document.getElementById('install');
  if (installBtn && ALLOW_WRITE) {
    installBtn.onclick = async () => {
      setStatus('installing');
      try {
        const res = await api('/api/install', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: e.id, targets: targets() }),
        });
        setStatus(res.error || ('installed: ' + ((res.applied || []).join(', ') || 'nothing, it already exists')), res.error ? 'bad' : '');
      } catch (err) {
        setStatus(err.message, 'bad');
      }
    };
  }
}

function renderLoading() {
  document.getElementById('list').innerHTML = Array.from({ length: 5 }, () =>
    '<div class="skel-row"><div class="skel" style="width:35%"></div>' +
    '<div class="skel" style="width:80%;margin-top:8px"></div></div>').join('');
  document.getElementById('detail').innerHTML = '<p class="empty">Reading the report.</p>';
}

renderLoading();

api('/api/report').then(r => {
  report = r;
  renderStats();
  renderList();
  const first = entries()[0];
  if (first) {
    select(first.id);
  } else {
    document.getElementById('detail').innerHTML =
      '<p class="empty"><b>No findings yet.</b>Run ritual scan once you have more agent history.</p>';
  }
}).catch(err => {
  document.getElementById('list').innerHTML = '';
  document.getElementById('detail').innerHTML =
    '<p class="empty"><b>Could not load the report.</b>' + esc(err.message) + '. The token in the URL may have expired; restart ritual ui.</p>';
});
</script>
</body>
</html>
